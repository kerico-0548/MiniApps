<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script>
/* =====================================================================
   ВСЁ, ЧТО МОЖНО МЕНЯТЬ, — ТОЛЬКО В ЭТОМ БЛОКЕ (до строки «КОНЕЦ БЛОКА»).
   Правила: текст пишется внутри кавычек "...", после каждой строки — запятая.
   ===================================================================== */
const ДАННЫЕ = {
  заголовок: "Сладко у Светы",
  подзаголовок: "Домашние торты и капкейки на заказ в Москве",
  логотип: "foto/logo.svg",

  кондитер: {
    имя: "Светлана Анатольевна",
    подпись: "Кондитер. Пеку дома, небольшими партиями и только под заказ."
  },

  // короткие плашки под заголовком
  преимущества: ["Ручная работа", "Свежая выпечка к дате", "Москва"],

  // блок «Как заказать»
  шаги: [
    "Выберите десерт в каталоге",
    "Нажмите «Заказать» — откроется WhatsApp с готовым сообщением",
    "Уточним дату, вес и оформление"
  ],

  контакты: {
    whatsapp: "+723123213121",
    телеграм: "sladkousveti_bot",    // ник без значка @
    текст: "Остались вопросы? Напишите — отвечу и помогу выбрать."
  },

  ассортимент: [
    {
      название: "Медовик",
      цена: "3 500 ₽",
      заЧто: "за 2 кг",
      описание: "Классический медовый торт: восемь тонких коржей и нежный сметанный крем.",
      фото: "foto/medovik.jpg",
      заказ: "Здравствуйте, Светлана Анатольевна! Хочу заказать Медовик (3 500 ₽ за 2 кг). Дата: … Вес: …"
    },
    {
      название: "Наполеон",
      цена: "3 800 ₽",
      заЧто: "за 2 кг",
      описание: "Хрустящие слоёные коржи и заварной крем на сливочном масле.",
      фото: "foto/napoleon.jpg",
      заказ: "Здравствуйте, Светлана Анатольевна! Хочу заказать Наполеон (3 800 ₽ за 2 кг). Дата: … Вес: …"
    },
    {
      название: "Капкейки",
      цена: "350 ₽",
      заЧто: "за штуку, от 6 шт.",
      описание: "Восемь вкусов на выбор — соберите свой набор.",
      фото: "foto/kapkeyki.jpg",
      заказ: "Здравствуйте, Светлана Анатольевна! Хочу заказать капкейки (350 ₽/шт., от 6 шт.). Дата: … Количество: … Вкусы: …"
    },
    {
      название: "Бенто-торт",
      цена: "1 900 ₽",
      заЧто: "",
      описание: "Маленький торт в коробочке — с любой надписью на ваш вкус.",
      фото: "foto/bento.jpg",
      заказ: "Здравствуйте, Светлана Анатольевна! Хочу заказать бенто-торт (1 900 ₽). Дата: … Надпись: …"
    }
  ]
};
/* ============================ КОНЕЦ БЛОКА ============================ */
</script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сладко у Светы</title>
<link rel="icon" href="foto/logo.svg">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #F8F5FC;
    --card: #FFFFFF;
    --text: #2E2440;
    --muted: #726585;
    --line: #E9E2F4;
    --accent: #6F45B5;
    --accent-strong: #573296;
    --accent-soft: #EFE8FA;
    --photo-bg: #EEE7F8;
    --on-accent: #FFFFFF;
    --shadow: 0 1px 2px rgba(46, 36, 64, .05), 0 8px 24px rgba(87, 50, 150, .08);
  }
  :root[data-theme="dark"] {
    --bg: #17131F;
    --card: #231D2E;
    --text: #EFEAF7;
    --muted: #B3A7C6;
    --line: #342B42;
    --accent: #B49BE3;
    --accent-strong: #C9B6EE;
    --accent-soft: #2F2640;
    --photo-bg: #2A2236;
    --on-accent: #1E1430;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 16px calc(28px + env(safe-area-inset-bottom));
  }
  .serif { font-family: Georgia, "Times New Roman", serif; }

  /* шапка */
  header { text-align: center; padding: 4px 0 24px; }
  header img { width: 112px; height: 112px; display: block; margin: 0 auto 14px; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: normal;
    font-size: 36px;
    line-height: 1.1;
    letter-spacing: .2px;
    margin: 0 0 8px;
    color: var(--accent-strong);
  }
  .subtitle { margin: 0 auto; max-width: 340px; font-size: 18px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; padding: 0; list-style: none; }
  .chips li {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent-strong);
    background: var(--accent-soft);
    padding: 6px 12px;
    border-radius: 999px;
  }

  /* общие блоки */
  .card {
    background: var(--card);
    border-radius: 22px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 32px 4px 12px;
  }

  /* о кондитере */
  .about { display: flex; gap: 14px; align-items: center; padding: 18px; }
  .avatar {
    flex: none;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent-strong);
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, serif;
    font-size: 24px;
  }
  .about b { display: block; font-size: 19px; }
  .about span { color: var(--muted); font-size: 16px; }

  /* как заказать */
  .steps { list-style: none; margin: 0; padding: 6px 18px; counter-reset: s; }
  .steps li {
    counter-increment: s;
    display: flex; gap: 14px; align-items: flex-start;
    padding: 12px 0;
    font-size: 17px;
  }
  .steps li + li { border-top: 1px solid var(--line); }
  .steps li::before {
    content: counter(s);
    flex: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 700;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    margin-top: -1px;
  }

  /* карточки товаров */
  .product { overflow: hidden; }
  .photo {
    aspect-ratio: 4 / 3;
    background: var(--photo-bg);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 22px;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { padding: 18px 18px 20px; }
  .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  h2 { margin: 0; font-size: 24px; line-height: 1.2; font-family: Georgia, "Times New Roman", serif; font-weight: normal; }
  .price { text-align: right; flex: none; }
  .price b { display: block; font-size: 24px; line-height: 1.2; color: var(--accent-strong); white-space: nowrap; }
  .price small { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
  .desc { margin: 10px 0 18px; color: var(--text); opacity: .9; }

  /* кнопки */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    min-height: 56px;
    padding: 12px 20px;
    border: 0;
    border-radius: 16px;
    background: var(--accent);
    color: var(--on-accent);
    font: inherit;
    font-size: 19px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .08s ease, filter .15s ease;
  }
  .btn:active { transform: scale(.98); filter: brightness(.93); }
  .btn.secondary { background: var(--accent-soft); color: var(--accent-strong); }
  .btn svg { width: 22px; height: 22px; flex: none; }

  /* контакты */
  .contacts { text-align: center; padding: 22px 18px 22px; }
  .contacts h2 { margin-bottom: 6px; }
  .contacts p { margin: 0 0 16px; color: var(--muted); }
  .contacts .btn + .btn { margin-top: 12px; }
  .contacts dl { margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: 16px; }
  .contacts dt { color: var(--muted); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; margin-top: 8px; }
  .contacts dd { margin: 0; }

  footer { text-align: center; color: var(--muted); font-size: 14px; padding: 8px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img id="logo" alt="">
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
    <ul class="chips" id="chips"></ul>
  </header>

  <section class="card about">
    <div class="avatar" id="avatar"></div>
    <div><b id="baker"></b><span id="bakerNote"></span></div>
  </section>

  <div class="section-title">Как заказать</div>
  <ol class="card steps" id="steps"></ol>

  <div class="section-title">Каталог</div>
  <main id="list"></main>

  <div class="section-title">Контакты</div>
  <section class="card contacts">
    <h2>Связаться со мной</h2>
    <p id="contactText"></p>
    <a class="btn" id="waBtn"></a>
    <a class="btn secondary" id="tgBtn"></a>
    <dl>
      <dt>Кондитер</dt><dd id="cName"></dd>
      <dt>Телефон / WhatsApp</dt><dd id="cPhone"></dd>
      <dt>Телеграм</dt><dd id="cTg"></dd>
    </dl>
  </section>

  <footer id="footer"></footer>
</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  const inTelegram = !!(tg && tg.initData);

  const ICON_WA = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.5-.3z"/></svg>';
  const ICON_TG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3 18.7 19.4c-.2 1-.9 1.3-1.7.8l-4.8-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.9 8.9-8c.4-.3-.1-.5-.6-.2L6.6 13.2 1.9 11.7c-1-.3-1-1 .2-1.5L20.6 3c.9-.3 1.6.2 1.3 1.3z"/></svg>';

  // --- Тема: светлая или тёмная, как в Телеграме (или как в телефоне в браузере)
  function applyTheme() {
    let dark;
    if (inTelegram) dark = tg.colorScheme === 'dark';
    else dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    if (inTelegram && tg.isVersionAtLeast && tg.isVersionAtLeast('6.1')) {
      const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      tg.setHeaderColor(bg);
      tg.setBackgroundColor(bg);
    }
  }

  // --- Ссылки: в Телеграме открываем правильно, в браузере — как обычно
  function openUrl(url) {
    if (!inTelegram) { window.open(url, '_blank', 'noopener'); return; }
    if (/^https:\/\/t\.me\//.test(url)) {
      // ссылки на t.me: открываем внутри Телеграма и закрываем мини-приложение
      tg.openTelegramLink(url);
      setTimeout(function () { tg.close(); }, 100);
    } else {
      tg.openLink(url);
    }
  }
  function bindLink(el, url) {
    el.href = url;
    el.target = '_blank';
    el.rel = 'noopener';
    el.addEventListener('click', function (e) { e.preventDefault(); openUrl(url); });
  }

  const waNumber = ДАННЫЕ.контакты.whatsapp.replace(/\D/g, '');
  function waLink(text) {
    return 'https://wa.me/' + waNumber + (text ? '?text=' + encodeURIComponent(text) : '');
  }
  const tgNick = ДАННЫЕ.контакты.телеграм.replace(/^@/, '');

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text) node.textContent = text;
    return node;
  }
  function setText(id, text) { document.getElementById(id).textContent = text; }
  function setButton(id, icon, label, url) {
    const b = document.getElementById(id);
    b.innerHTML = icon;
    b.appendChild(document.createTextNode(label));
    bindLink(b, url);
  }

  function render() {
    const D = ДАННЫЕ;
    document.title = D.заголовок;

    const logo = document.getElementById('logo');
    logo.src = D.логотип;
    logo.alt = D.заголовок;
    logo.onerror = function () { logo.remove(); };
    setText('title', D.заголовок);
    setText('subtitle', D.подзаголовок);

    const chips = document.getElementById('chips');
    (D.преимущества || []).forEach(function (t) { chips.appendChild(el('li', '', t)); });

    const k = D.кондитер;
    setText('avatar', k.имя.charAt(0));
    setText('baker', k.имя);
    setText('bakerNote', k.подпись);

    const steps = document.getElementById('steps');
    (D.шаги || []).forEach(function (t) { steps.appendChild(el('li', '', t)); });

    const list = document.getElementById('list');
    D.ассортимент.forEach(function (item) {
      const card = el('article', 'card product');

      const photo = el('div', 'photo');
      const img = document.createElement('img');
      img.src = item.фото;
      img.alt = item.название;
      img.loading = 'lazy';
      img.onerror = function () { img.remove(); photo.textContent = item.название; };
      photo.appendChild(img);
      card.appendChild(photo);

      const body = el('div', 'body');
      const row = el('div', 'row');
      row.appendChild(el('h2', '', item.название));
      const price = el('div', 'price');
      price.appendChild(el('b', '', item.цена));
      if (item.заЧто) price.appendChild(el('small', '', item.заЧто));
      row.appendChild(price);
      body.appendChild(row);
      body.appendChild(el('p', 'desc', item.описание));

      const btn = el('a', 'btn');
      btn.innerHTML = ICON_WA;
      btn.appendChild(document.createTextNode('Заказать'));
      bindLink(btn, waLink(item.заказ));
      body.appendChild(btn);

      card.appendChild(body);
      list.appendChild(card);
    });

    const c = D.контакты;
    setText('contactText', c.текст);
    setButton('waBtn', ICON_WA, 'Написать в WhatsApp', waLink('Здравствуйте, ' + k.имя + '!'));
    setButton('tgBtn', ICON_TG, 'Написать в Телеграм', 'https://t.me/' + tgNick);
    setText('cName', k.имя);
    setText('cPhone', c.whatsapp);
    setText('cTg', '@' + tgNick);
    setText('footer', '© ' + new Date().getFullYear() + ' ' + D.заголовок + ' · ' + k.имя);
  }

  applyTheme();
  render();
  if (inTelegram) {
    tg.ready();
    tg.expand();
    tg.onEvent('themeChanged', applyTheme);
  } else if (window.matchMedia) {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', applyTheme);
  }
</script>
</body>
</html>
