<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script>
/* =====================================================================
   ВСЁ, ЧТО МОЖНО МЕНЯТЬ, — ТОЛЬКО В ЭТОМ БЛОКЕ (до строки «КОНЕЦ БЛОКА»).
   Правила: текст пишется внутри кавычек "...", после каждой строки — запятая.
   ===================================================================== */
const ДАННЫЕ = {
  заголовок: "Сладко у Светы",
  подзаголовок: "Домашние торты и капкейки в Москве, с любовью ❤️",
  логотип: "foto/logo.svg",
  текстНадКаталогом: "Выберите десерт и нажмите «Заказать» — откроется WhatsApp с готовым сообщением.",

  контакты: {
    whatsapp: "+7 999 123-45-67",
    телеграм: "svetlana",            // ник без значка @
    текст: "Остались вопросы? Напишите мне — отвечу и помогу выбрать."
  },

  ассортимент: [
    {
      название: "Медовик",
      цена: "3 500 ₽",
      заЧто: "за 2 кг",
      описание: "Классический медовый торт, восемь тонких коржей и нежный сметанный крем.",
      фото: "foto/medovik.jpg",
      заказ: "Здравствуйте, Светлана! Хочу заказать Медовик (3 500 ₽ за 2 кг). Дата: … Вес: …"
    },
    {
      название: "Наполеон",
      цена: "3 800 ₽",
      заЧто: "за 2 кг",
      описание: "Хрустящие слоёные коржи и заварной крем на сливочном масле.",
      фото: "foto/napoleon.jpg",
      заказ: "Здравствуйте, Светлана! Хочу заказать Наполеон (3 800 ₽ за 2 кг). Дата: … Вес: …"
    },
    {
      название: "Капкейки",
      цена: "350 ₽",
      заЧто: "за штуку, от 6 шт.",
      описание: "Восемь вкусов на выбор — соберите свой набор.",
      фото: "foto/kapkeyki.jpg",
      заказ: "Здравствуйте, Светлана! Хочу заказать капкейки (350 ₽/шт., от 6 шт.). Дата: … Количество: … Вкусы: …"
    },
    {
      название: "Бенто-торт",
      цена: "1 900 ₽",
      заЧто: "",
      описание: "Маленький торт в коробочке — с любой надписью на ваш вкус.",
      фото: "foto/bento.jpg",
      заказ: "Здравствуйте, Светлана! Хочу заказать бенто-торт (1 900 ₽). Дата: … Надпись: …"
    }
  ]
};
/* ============================ КОНЕЦ БЛОКА ============================ */
</script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сладко у Светы</title>
<link rel="icon" href="foto/logo.svg">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #FFF8F3;
    --card: #FFFFFF;
    --text: #4A3236;
    --muted: #8C6E72;
    --accent: #CF6A84;
    --accent-strong: #B9506B;
    --accent-soft: #FBE3E8;
    --cream: #F7EBDD;
    --on-accent: #FFFFFF;
    --shadow: 0 6px 20px rgba(176, 74, 99, .10);
  }
  :root[data-theme="dark"] {
    --bg: #241B1E;
    --card: #33272B;
    --text: #F6E9EC;
    --muted: #C6A9AF;
    --accent: #EFA3B5;
    --accent-strong: #F4B9C6;
    --accent-soft: #46323A;
    --cream: #3B2E30;
    --on-accent: #3A1F27;
    --shadow: 0 6px 20px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 18px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px calc(32px + env(safe-area-inset-bottom));
  }

  header { text-align: center; padding: 8px 0 20px; }
  header img { width: 120px; height: 120px; display: block; margin: 0 auto 12px; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: normal;
    font-size: 34px;
    line-height: 1.15;
    margin: 0 0 8px;
    color: var(--accent-strong);
  }
  .subtitle { margin: 0; font-size: 19px; color: var(--muted); }
  .hint {
    background: var(--accent-soft);
    border-radius: 16px;
    padding: 14px 16px;
    margin: 0 0 20px;
    font-size: 17px;
  }

  .card {
    background: var(--card);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-bottom: 22px;
  }
  .photo {
    aspect-ratio: 4 / 3;
    background: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 22px;
    font-style: italic;
    font-family: Georgia, serif;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { padding: 18px 18px 20px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h2 { margin: 0; font-size: 25px; line-height: 1.2; }
  .price {
    background: var(--accent-soft);
    color: var(--accent-strong);
    font-weight: 700;
    font-size: 24px;
    padding: 4px 14px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .per { color: var(--muted); font-size: 16px; margin-top: 4px; }
  .desc { margin: 10px 0 18px; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    min-height: 58px;
    padding: 12px 20px;
    border: 0;
    border-radius: 18px;
    background: var(--accent);
    color: var(--on-accent);
    font: inherit;
    font-size: 20px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .08s ease, filter .15s ease;
  }
  .btn:active { transform: scale(.98); filter: brightness(.95); }
  .btn.secondary { background: var(--accent-soft); color: var(--accent-strong); }
  .btn svg { width: 24px; height: 24px; flex: none; }

  .contacts { text-align: center; padding: 22px 18px 24px; }
  .contacts h2 { margin-bottom: 8px; }
  .contacts p { margin: 0 0 16px; color: var(--muted); }
  .contacts .btn + .btn { margin-top: 12px; }
  .phone { margin-top: 16px; font-size: 17px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img id="logo" alt="">
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <p class="hint" id="hint"></p>
  <main id="list"></main>

  <section class="contacts card body" id="contacts">
    <h2>Связаться со мной</h2>
    <p id="contactText"></p>
    <a class="btn" id="waBtn"></a>
    <a class="btn secondary" id="tgBtn"></a>
    <div class="phone" id="phone"></div>
  </section>
</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  const inTelegram = !!(tg && tg.initData);

  const ICON_WA = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.5-.3z"/></svg>';
  const ICON_TG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3 18.7 19.4c-.2 1-.9 1.3-1.7.8l-4.8-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.9 8.9-8c.4-.3-.1-.5-.6-.2L6.6 13.2 1.9 11.7c-1-.3-1-1 .2-1.5L20.6 3c.9-.3 1.6.2 1.3 1.3z"/></svg>';

  // --- Тема: светлая или тёмная, как в Телеграме (или как в телефоне в браузере)
  function applyTheme() {
    let dark;
    if (inTelegram) dark = tg.colorScheme === 'dark';
    else dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    if (inTelegram && tg.isVersionAtLeast && tg.isVersionAtLeast('6.1')) {
      const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      tg.setHeaderColor(bg);
      tg.setBackgroundColor(bg);
    }
  }

  // --- Ссылки: в Телеграме открываем правильно, в браузере — как обычно
  function openUrl(url) {
    if (!inTelegram) { window.open(url, '_blank', 'noopener'); return; }
    if (/^https:\/\/t\.me\//.test(url)) {
      // ссылки на t.me: открываем внутри Телеграма и закрываем мини-приложение
      tg.openTelegramLink(url);
      setTimeout(function () { tg.close(); }, 100);
    } else {
      tg.openLink(url);
    }
  }
  function bindLink(el, url) {
    el.href = url;
    el.target = '_blank';
    el.rel = 'noopener';
    el.addEventListener('click', function (e) { e.preventDefault(); openUrl(url); });
  }

  const waNumber = ДАННЫЕ.контакты.whatsapp.replace(/\D/g, '');
  function waLink(text) {
    return 'https://wa.me/' + waNumber + (text ? '?text=' + encodeURIComponent(text) : '');
  }

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text) node.textContent = text;
    return node;
  }

  function render() {
    document.title = ДАННЫЕ.заголовок;
    const logo = document.getElementById('logo');
    logo.src = ДАННЫЕ.логотип;
    logo.alt = ДАННЫЕ.заголовок;
    logo.onerror = function () { logo.remove(); };
    document.getElementById('title').textContent = ДАННЫЕ.заголовок;
    document.getElementById('subtitle').textContent = ДАННЫЕ.подзаголовок;
    document.getElementById('hint').textContent = ДАННЫЕ.текстНадКаталогом;

    const list = document.getElementById('list');
    ДАННЫЕ.ассортимент.forEach(function (item) {
      const card = el('article', 'card');

      const photo = el('div', 'photo');
      const img = document.createElement('img');
      img.src = item.фото;
      img.alt = item.название;
      img.loading = 'lazy';
      img.onerror = function () { img.remove(); photo.textContent = item.название; };
      photo.appendChild(img);
      card.appendChild(photo);

      const body = el('div', 'body');
      const row = el('div', 'row');
      row.appendChild(el('h2', '', item.название));
      row.appendChild(el('span', 'price', item.цена));
      body.appendChild(row);
      if (item.заЧто) body.appendChild(el('div', 'per', item.заЧто));
      body.appendChild(el('p', 'desc', item.описание));

      const btn = el('a', 'btn');
      btn.innerHTML = ICON_WA;
      btn.appendChild(document.createTextNode('Заказать'));
      bindLink(btn, waLink(item.заказ));
      body.appendChild(btn);

      card.appendChild(body);
      list.appendChild(card);
    });

    const c = ДАННЫЕ.контакты;
    document.getElementById('contactText').textContent = c.текст;
    const wa = document.getElementById('waBtn');
    wa.innerHTML = ICON_WA;
    wa.appendChild(document.createTextNode('Написать в WhatsApp'));
    bindLink(wa, waLink('Здравствуйте, Светлана!'));
    const tgBtn = document.getElementById('tgBtn');
    tgBtn.innerHTML = ICON_TG;
    tgBtn.appendChild(document.createTextNode('Написать в Телеграм'));
    bindLink(tgBtn, 'https://t.me/' + c.телеграм.replace(/^@/, ''));
    document.getElementById('phone').textContent = c.whatsapp + ' · @' + c.телеграм.replace(/^@/, '');
  }

  applyTheme();
  render();
  if (inTelegram) {
    tg.ready();
    tg.expand();
    tg.onEvent('themeChanged', applyTheme);
  } else if (window.matchMedia) {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', applyTheme);
  }
</script>
</body>
</html>
